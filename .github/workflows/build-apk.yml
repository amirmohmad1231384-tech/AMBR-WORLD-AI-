name: Build AMBR APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: دریافت سورس مخزن
        uses: actions/checkout@v4

      - name: پیدا کردن و استخراج بسته اندروید
        shell: bash
        run: |
          set -e

          mkdir -p "$RUNNER_TEMP/ambr-kit"

          KIT=""

          for z in "$GITHUB_WORKSPACE"/*.zip; do
            [ -f "$z" ] || continue

            NAME=$(basename "$z")

            if [ "$NAME" = "AMBR_GITHUB_BUILD_WORKFLOW.zip" ]; then
              continue
            fi

            if unzip -Z1 "$z" | grep -Eq '(^|/)settings.gradle$' &&
               unzip -Z1 "$z" | grep -Eq '(^|/)app/build.gradle$'; then
              KIT="$z"
              break
            fi
          done

          if [ -z "$KIT" ]; then
            echo "ERROR: بسته واقعی پروژه اندروید پیدا نشد."
            echo "باید ZIP شامل settings.gradle و app/build.gradle در مخزن باشد."
            exit 1
          fi

          echo "بسته پیدا شد: $KIT"

          unzip -oq "$KIT" -d "$RUNNER_TEMP/ambr-kit"

          ROOT=$(find "$RUNNER_TEMP/ambr-kit" -type f -name settings.gradle -printf '%h\n' | head -n 1)

          if [ -z "$ROOT" ] || [ ! -f "$ROOT/app/build.gradle" ]; then
            echo "ERROR: ساختار پروژه اندروید ناقص است."
            exit 1
          fi

          cp -a "$ROOT"/. "$GITHUB_WORKSPACE"/

          test -f settings.gradle
          test -f app/build.gradle

      - name: نصب جاوا
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: نصب ابزار اندروید
        uses: android-actions/setup-android@v3

      - name: نصب Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: نصب Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          sudo unzip -oq /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: ساخت APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: بررسی فایل APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/

      - name: آماده‌سازی دانلود APK
        uses: actions/upload-artifact@v4
        with:
          name: AMBR-Android-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
