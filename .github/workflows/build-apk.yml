
name: AMBR Build APK

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build AMBR Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract Android build kit
        shell: bash
        run: |
          set -e
          KIT=""
          while IFS= read -r -d '' FILE; do
            if unzip -Z1 "$FILE" | grep -qx 'settings.gradle' &&
               unzip -Z1 "$FILE" | grep -qx 'app/build.gradle'; then
              KIT="$FILE"
              break
            fi
          done < <(find . -maxdepth 2 -type f -iname '*.zip' -print0)

          if [ -z "$KIT" ]; then
            echo "ERROR: Android build kit ZIP not found."
            exit 1
          fi

          echo "Found build kit: $KIT"
          unzip -o "$KIT" -d .
          test -f settings.gradle
          test -f app/build.gradle

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        shell: bash
        run: |
          set -e
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          SDK="$ANDROID_HOME"
          SDKMANAGER=$(find "$SDK/cmdline-tools" -type f -name sdkmanager -print -quit)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses
          set -o pipefail

          "$SDKMANAGER" --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -e
          curl -fL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AMBR-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
concurrency:
