      - name: Find and extract Android build kit
        shell: bash
        run: |
          set -e

          KIT=""

          while IFS= read -r -d '' FILE; do
            if unzip -Z1 "$FILE" | grep -Eq '(^|/)settings.gradle$' &&
               unzip -Z1 "$FILE" | grep -Eq '(^|/)app/build.gradle$'; then
              KIT="$FILE"
              break
            fi
          done < <(find . -maxdepth 2 -type f -iname '*.zip' -print0)

          if [ -z "$KIT" ]; then
            echo "ERROR: No ZIP containing Android Gradle project was found."
            echo "Available ZIP files:"
            find . -maxdepth 2 -type f -iname '*.zip'
            exit 1
          fi

          echo "Found: $KIT"

          TEMP_DIR=$(mktemp -d)
          unzip -q "$KIT" -d "$TEMP_DIR"

          SETTINGS=$(find "$TEMP_DIR" -type f -name settings.gradle -print -quit)
          PROJECT_DIR=$(dirname "$SETTINGS")

          test -f "$PROJECT_DIR/app/build.gradle"

          cp -a "$PROJECT_DIR"/. .

          test -f settings.gradle
          test -f app/build.gradle

          echo "Android project extracted successfully."
