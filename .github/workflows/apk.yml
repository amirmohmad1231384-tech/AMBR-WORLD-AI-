name: AMBR Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Android project ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for Android project..."

          FOUND=""

          while IFS= read -r -d '' ZIP; do
            echo "Checking: $ZIP"

            if ! unzip -tq "$ZIP" >/dev/null 2>&1; then
              continue
            fi

            TEMP="$(mktemp -d)"
            unzip -q "$ZIP" -d "$TEMP"

            SETTINGS="$(find "$TEMP" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"

            if [ -z "$SETTINGS" ]; then
              rm -rf "$TEMP"
              continue
            fi

            PROJECT="$(dirname "$SETTINGS")"

            if [ -f "$PROJECT/app/build.gradle" ] || [ -f "$PROJECT/app/build.gradle.kts" ]; then
              FOUND="$PROJECT"
              echo "Android project found."
              break
            fi

            rm -rf "$TEMP"
          done < <(find . -type f -iname '*.zip' -not -path './.git/*' -print0)

          if [ -z "$FOUND" ]; then
            echo "ERROR: No complete Android project found in ZIP files."
            echo "ZIP files in repository:"
            find . -type f -iname '*.zip' -not -path './.git/*'
            exit 1
          fi

          cp -a "$FOUND/." .

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AMBR-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
